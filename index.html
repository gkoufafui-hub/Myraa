<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Myraa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #05030a;
    color: #fff;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      radial-gradient(circle at 50% 30%, rgba(160, 60, 255, 0.2), transparent 60%),
      linear-gradient(#05030a, #0a0518);
  }

  .app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 22px;
  }

  /* Top brand */
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: #c8a8ff;
    text-transform: uppercase;
    font-weight: 600;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #b580ff;
    box-shadow: 0 0 12px #b580ff;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }

  /* Character stage */
  .stage {
    position: relative;
    width: min(72vw, 300px);
    aspect-ratio: 9 / 16;
    flex-shrink: 0;
  }

  /* Rotating rings */
  .ring {
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 1px solid rgba(180, 120, 255, 0.3);
    border-top-color: rgba(200, 140, 255, 0.9);
    animation: spin 6s linear infinite;
    pointer-events: none;
  }
  .ring2 {
    inset: -32px;
    border: 1px dashed rgba(160, 100, 255, 0.25);
    border-top-color: transparent;
    animation: spin 12s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Video frame */
  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 22px;
    overflow: hidden;
    border: 1.5px solid rgba(180, 120, 255, 0.55);
    box-shadow:
      0 0 50px rgba(180, 100, 255, 0.45),
      inset 0 0 20px rgba(160, 80, 255, 0.15);
    background: #0a0418;
    animation: glow 4s ease-in-out infinite;
  }
  @keyframes glow {
    50% {
      box-shadow:
        0 0 70px rgba(180, 100, 255, 0.7),
        inset 0 0 30px rgba(160, 80, 255, 0.25);
    }
  }

  .video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }
  .video.active { opacity: 1; }

  /* HUD corners */
  .corner {
    position: absolute;
    width: 20px; height: 20px;
    border: 2px solid rgba(200, 140, 255, 0.9);
    z-index: 5;
    pointer-events: none;
  }
  .tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
  .tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
  .bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
  .br { bottom: 10px; right: 10px; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }

  /* Name badge */
  .badge {
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 8, 40, 0.95);
    border: 1px solid rgba(180, 120, 255, 0.6);
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: #d8b8ff;
    text-transform: uppercase;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 0 20px rgba(180, 100, 255, 0.5);
    z-index: 6;
  }

  /* Control panel */
  .controls {
    width: 100%;
    max-width: 340px;
    background: rgba(20, 10, 40, 0.6);
    border: 1px solid rgba(160, 100, 255, 0.3);
    border-radius: 16px;
    padding: 12px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn {
    flex: 1;
    background: rgba(120, 60, 200, 0.15);
    border: 1px solid rgba(180, 120, 255, 0.35);
    color: #c8a8ff;
    padding: 12px 6px;
    border-radius: 10px;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .btn.active {
    background: rgba(180, 100, 255, 0.4);
    border-color: rgba(200, 140, 255, 0.9);
    color: #fff;
    box-shadow: 0 0 18px rgba(180, 100, 255, 0.55);
  }
  .btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="app">
  <div class="brand">
    <div class="dot"></div>
    <span>Myraa System</span>
  </div>

  <div class="stage">
    <div class="ring"></div>
    <div class="ring ring2"></div>
    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <video id="v-idle" class="video active"
        src="Anime_girl_sitting_peacefully_20260923183801.mp4"
        autoplay loop muted playsinline preload="auto"></video>

      <video id="v-thinking" class="video"
        src="Anime_girl_thinking_with_particles_20260923183915.mp4"
        loop muted playsinline preload="metadata"></video>

      <video id="v-talking" class="video"
        src="Anime_girl_talking_to_camera_20260923184106.mp4"
        loop muted playsinline preload="metadata"></video>

      <div class="badge" id="badge">Idle</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn active" data-state="idle">Idle</button>
    <button class="btn" data-state="thinking">Think</button>
    <button class="btn" data-state="talking">Talk</button>
  </div>
</div>

<script>
  const videos = {
    idle: document.getElementById('v-idle'),
    thinking: document.getElementById('v-thinking'),
    talking: document.getElementById('v-talking')
  };
  const badge = document.getElementById('badge');
  const buttons = document.querySelectorAll('.btn');

  let current = 'idle';
  let primed = false;

  // PRIME all videos on first user tap so mobile allows future autoplay
  function primeAllVideos() {
    if (primed) return;
    primed = true;
    Object.entries(videos).forEach(([name, v]) => {
      if (name === 'idle') return; // idle already playing
      const p = v.play();
      if (p && p.then) {
        p.then(() => {
          // Played successfully - pause immediately to reset
          setTimeout(() => {
            v.pause();
            v.currentTime = 0;
          }, 50);
        }).catch(() => {});
      }
    });
  }

  function setState(state) {
    if (state === current && videos[state].classList.contains('active')) return;
    current = state;

    // Hide & pause all others
    Object.entries(videos).forEach(([name, v]) => {
      if (name !== state) {
        v.classList.remove('active');
        v.pause();
      }
    });

    const active = videos[state];

    // Ensure loaded
    if (active.readyState === 0) active.load();

    active.currentTime = 0;
    active.classList.add('active');

    const playPromise = active.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(err => {
        console.log('play retry:', err);
        // Retry after a tick
        setTimeout(() => active.play().catch(() => {}), 100);
      });
    }

    badge.textContent = state.charAt(0).toUpperCase() + state.slice(1);
    buttons.forEach(b => b.classList.toggle('active', b.dataset.state === state));
  }

  // Buttons
  buttons.forEach(b => {
    b.addEventListener('click', (e) => {
      e.preventDefault();
      primeAllVideos();          // prime on first tap
      setState(b.dataset.state);
    });
    // Also handle touchstart for faster response
    b.addEventListener('touchstart', () => {
      primeAllVideos();
    }, { passive: true, once: false });
  });

  // Global first-tap prime (for autoplay on iOS/Android)
  document.body.addEventListener('touchstart', () => {
    primeAllVideos();
    // Make sure idle is playing
    if (videos.idle.paused) videos.idle.play().catch(() => {});
  }, { once: true });

  document.body.addEventListener('click', () => {
    primeAllVideos();
    if (videos.idle.paused) videos.idle.play().catch(() => {});
  }, { once: true });

  // Try autoplay idle on load
  window.addEventListener('load', () => {
    videos.idle.play().catch(() => {});
  });
</script>

</body>
</html>
