<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myraa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --accent: #b580ff;
    --accent-dark: #7a3fd6;
    --glow: rgba(180, 100, 255, 0.5);
  }
  body.theme-blue { --accent: #5b9dff; --accent-dark: #2d5fb8; --glow: rgba(90, 150, 255, 0.5); }
  body.theme-green { --accent: #4dffb0; --accent-dark: #1a9c68; --glow: rgba(80, 255, 180, 0.5); }

  body {
    background: #05030a; color: #fff;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh; overflow-x: hidden;
    background-image: radial-gradient(circle at 50% 30%, var(--glow), transparent 60%);
  }

  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 70px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: rgba(5, 3, 10, 0.95);
    border-bottom: 2px solid var(--accent);
    z-index: 1000;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.9rem; letter-spacing: 0.3em;
    color: var(--accent); text-transform: uppercase; font-weight: 700;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 15px var(--accent);
  }
  #menuBtn {
    width: 50px; height: 50px; border-radius: 14px;
    background: var(--accent); border: none;
    display: flex; align-items: center; justify-content: center;
    gap: 5px; cursor: pointer; padding: 0;
    box-shadow: 0 0 20px var(--accent);
  }
  #menuBtn span { width: 6px; height: 6px; border-radius: 50%; background: #fff; }

  #menuPanel {
    position: fixed; top: 0; right: -290px;
    width: 270px; height: 100vh;
    background: #0f081e;
    border-left: 2px solid var(--accent);
    z-index: 2000; transition: right 0.3s ease;
    padding: 90px 20px 20px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: -15px 0 50px rgba(0,0,0,0.8);
    overflow-y: auto;
  }
  #menuPanel.open { right: 0; }
  .menu-title {
    font-size: 0.7rem; letter-spacing: 0.4em;
    color: var(--accent); text-transform: uppercase;
    margin-bottom: 10px; font-weight: 700;
  }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; border-radius: 12px;
    background: rgba(120, 60, 200, 0.2);
    border: 1px solid var(--accent);
    color: #fff; font-size: 0.9rem;
    cursor: pointer; font-family: inherit;
    text-align: left; width: 100%; font-weight: 600;
  }
  .menu-item:active { background: var(--accent-dark); }
  .menu-icon { font-size: 1.3rem; }

  #menuOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s; z-index: 1500;
  }
  #menuOverlay.open { opacity: 1; pointer-events: auto; }

  .modal {
    position: fixed; top: 85px; left: 50%;
    transform: translateX(-50%) translateY(-30px);
    width: 90%; max-width: 370px;
    background: #0f081e;
    border: 2px solid var(--accent);
    border-radius: 18px; padding: 20px;
    z-index: 2500; opacity: 0; pointer-events: none;
    transition: all 0.3s;
    box-shadow: 0 15px 50px var(--glow);
    max-height: 78vh; overflow-y: auto;
  }
  .modal.show {
    opacity: 1; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .modal-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 16px;
  }
  .modal-title {
    font-size: 0.8rem; letter-spacing: 0.3em;
    color: var(--accent); text-transform: uppercase; font-weight: 700;
  }
  .modal-close {
    background: transparent; border: none;
    color: var(--accent); font-size: 1.3rem; cursor: pointer;
  }

  .setting-row {
    display: flex; justify-content: space-between;
    align-items: center; padding: 12px 0;
    border-bottom: 1px solid rgba(160, 100, 255, 0.2);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 0.85rem; color: #d8b8ff; }
  .setting-input {
    background: rgba(120, 60, 200, 0.15);
    border: 1px solid var(--accent);
    color: #fff; padding: 8px 12px;
    border-radius: 8px; font-size: 0.85rem;
    font-family: inherit; width: 140px; outline: none;
  }
  .toggle {
    position: relative; width: 48px; height: 26px;
    background: rgba(120, 60, 200, 0.3);
    border-radius: 13px; cursor: pointer;
    transition: background 0.3s;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: ''; position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    border-radius: 50%; background: #fff;
    transition: left 0.3s;
  }
  .toggle.on::after { left: 25px; }

  .theme-btns { display: flex; gap: 8px; }
  .theme-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
  }
  .theme-btn.purple { background: #b580ff; }
  .theme-btn.blue { background: #5b9dff; }
  .theme-btn.green { background: #4dffb0; }
  .theme-btn.active { border-color: #fff; }

  .save-btn {
    width: 100%; padding: 12px;
    background: var(--accent); border: none;
    border-radius: 10px; color: #fff;
    font-weight: 700; font-size: 0.85rem;
    letter-spacing: 0.15em; cursor: pointer;
    margin-top: 16px; font-family: inherit;
  }

  .scan-area { text-align: center; padding: 20px 0; }
  .scan-circle {
    width: 140px; height: 140px;
    border-radius: 50%; border: 3px solid var(--accent);
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem;
    box-shadow: 0 0 40px var(--glow);
    position: relative;
  }
  .scan-circle.scanning { animation: scanPulse 1s infinite; }
  @keyframes scanPulse {
    0%, 100% { box-shadow: 0 0 20px var(--glow); }
    50% { box-shadow: 0 0 60px var(--accent); }
  }
  .scan-btn {
    width: 100%; padding: 12px;
    background: var(--accent); border: none;
    border-radius: 10px; color: #fff;
    font-weight: 700; font-size: 0.85rem;
    cursor: pointer; margin-top: 10px; font-family: inherit;
  }
  .scan-result {
    margin-top: 16px; padding: 12px;
    background: rgba(80, 255, 180, 0.15);
    border: 1px solid rgba(80, 255, 180, 0.5);
    border-radius: 10px;
    color: #a0ffd0; font-size: 0.85rem;
    text-align: left;
  }

  .atoz-grid {
    display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .atoz-letter {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    background: rgba(120, 60, 200, 0.2);
    border: 1px solid var(--accent);
    border-radius: 10px; color: #fff;
    font-weight: 700; font-size: 0.9rem;
    cursor: pointer; font-family: inherit;
  }
  .atoz-letter:active { background: var(--accent); }
  .atoz-detail {
    margin-top: 16px; padding: 14px;
    background: rgba(120, 60, 200, 0.15);
    border-radius: 12px;
    font-size: 0.85rem; color: #d8b8ff;
    min-height: 60px; line-height: 1.5;
  }

  .app {
    padding: 90px 20px 30px;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
  }
  .stage {
    position: relative;
    width: min(72vw, 290px);
    aspect-ratio: 9 / 16;
  }
  .frame {
    position: relative; width: 100%; height: 100%;
    border-radius: 20px; overflow: hidden;
    border: 2px solid var(--accent);
    box-shadow: 0 0 60px var(--glow);
    background: #0a0418;
  }
  .video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; opacity: 0;
    transition: opacity 0.3s;
  }
  .video.active { opacity: 1; }
  .corner {
    position: absolute; width: 22px; height: 22px;
    border: 2px solid var(--accent);
    z-index: 5; pointer-events: none;
  }
  .tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
  .tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; }
  .br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }
  .badge {
    position: absolute; bottom: -14px; left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 8, 40, 0.98);
    border: 1px solid var(--accent);
    padding: 6px 18px; border-radius: 20px;
    font-size: 0.7rem; letter-spacing: 0.3em;
    color: var(--accent); text-transform: uppercase;
    font-weight: 700; z-index: 6;
  }
  .controls {
    width: 100%; max-width: 340px;
    background: rgba(20, 10, 40, 0.8);
    border: 1px solid var(--accent);
    border-radius: 16px; padding: 12px;
    display: flex; gap: 8px;
  }
  .btn {
    flex: 1;
    background: rgba(120, 60, 200, 0.2);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 14px 6px; border-radius: 10px;
    font-size: 0.72rem; letter-spacing: 0.15em;
    font-weight: 700; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
  }
  .btn.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 20px var(--glow);
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand"><div class="dot"></div><span>Myraa</span></div>
  <button id="menuBtn"><span></span><span></span><span></span></button>
</div>

<div id="menuOverlay"></div>

<div id="menuPanel">
  <div class="menu-title">Menu</div>
  <button class="menu-item" id="mWeather"><span class="menu-icon">🌤️</span><span>Weather</span></button>
  <button class="menu-item" id="mSettings"><span class="menu-icon">⚙️</span><span>Settings</span></button>
  <button class="menu-item" id="mScanner"><span class="menu-icon">🛡️</span><span>Scanner</span></button>
  <button class="menu-item" id="mAtoz"><span class="menu-icon">🔤</span><span>A to Z</span></button>
  <button class="menu-item" id="mStats"><span class="menu-icon">📊</span><span>Stats</span></button>
  <button class="menu-item" id="mShare"><span class="menu-icon">🔗</span><span>Share</span></button>
  <button class="menu-item" id="mAbout"><span class="menu-icon">ℹ️</span><span>About</span></button>
</div>

<div class="modal" id="weatherModal">
  <div class="modal-header">
    <div class="modal-title" id="wLoc">Loading...</div>
    <button class="modal-close" data-close>✕</button>
  </div>
  <div id="wContent"><div style="text-align:center;padding:10px;color:#c8a8ff;">Detecting...</div></div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-header">
    <div class="modal-title">Settings</div>
    <button class="modal-close" data-close>✕</button>
  </div>
  <div class="setting-row">
    <div class="setting-label">Your Name</div>
    <input class="setting-input" id="userName" placeholder="Enter name" maxlength="20">
  </div>
  <div class="setting-row">
    <div class="setting-label">Voice</div>
    <div class="toggle" id="voiceToggle"></div>
  </div>
  <div class="setting-row">
    <div class="setting-label">Theme</div>
    <div class="theme-btns">
      <div class="theme-btn purple active" data-theme="purple"></div>
      <div class="theme-btn blue" data-theme="blue"></div>
      <div class="theme-btn green" data-theme="green"></div>
    </div>
  </div>
  <div class="setting-row">
    <div class="setting-label">Version</div>
    <div class="setting-label" style="color:#7fffbf;">v1.0.0</div>
  </div>
  <button class="save-btn" id="saveSettings">SAVE</button>
</div>

<div class="modal" id="scannerModal">
  <div class="modal-header">
    <div class="modal-title">Security Scanner</div>
    <button class="modal-close" data-close>✕</button>
  </div>
  <div class="scan-area">
    <div class="scan-circle" id="scanCircle">🛡️</div>
    <div style="color:#d8b8ff;font-size:0.85rem;margin-bottom:14px;" id="scanStatus">Ready to scan</div>
    <button class="scan-btn" id="startScan">START SCAN</button>
    <button class="scan-btn" id="scanURL" style="background:transparent;border:1px solid var(--accent);color:var(--accent);">SCAN URL</button>
  </div>
  <div id="scanResult"></div>
</div>

<div class="modal" id="atozModal">
  <div class="modal-header">
    <div class="modal-title">A to Z</div>
    <button class="modal-close" data-close>✕</button>
  </div>
  <div class="atoz-grid" id="atozGrid"></div>
  <div class="atoz-detail" id="atozDetail">Letter pe tap karo</div>
</div>

<div class="modal" id="statsModal">
  <div class="modal-header">
    <div class="modal-title">Stats</div>
    <button class="modal-close" data-close>✕</button>
  </div>
  <div class="setting-row"><div class="setting-label">First Used</div><div class="setting-label" id="statFirst">-</div></div>
  <div class="setting-row"><div class="setting-label">Days Active</div><div class="setting-label" id="statDays">0</div></div>
  <div class="setting-row"><div class="setting-label">Sessions</div><div class="setting-label" id="statSessions">0</div></div>
  <button class="save-btn" id="resetStats" style="background:#7a1d1d;">RESET DATA</button>
</div>

<div class="modal" id="aboutModal">
  <div class="modal-header">
    <div class="modal-title">About Myraa</div>
    <button class="modal-close" data-close>✕</button>
  </div>
  <div style="text-align:center;padding:14px 0;">
    <div style="font-size:3rem;margin-bottom:10px;">💜</div>
    <div style="font-size:1.3rem;color:var(--accent);font-weight:700;letter-spacing:0.2em;">MYRAA</div>
    <div style="color:#c8a8ff;font-size:0.85rem;margin-top:4px;">Personal AI Companion</div>
    <div style="color:#7a6fa0;font-size:0.75rem;margin-top:12px;">Version 1.0.0</div>
  </div>
</div>

<div class="app">
  <div class="stage">
    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <video id="v-idle" class="video active" src="Anime_girl_sitting_peacefully_20260923183801.mp4" autoplay loop muted playsinline preload="auto"></video>
      <video id="v-thinking" class="video" src="Anime_girl_thinking_with_particles_20260923183915.mp4" loop muted playsinline preload="metadata"></video>
      <video id="v-talking" class="video" src="Anime_girl_talking_to_camera_20260923184106.mp4" loop muted playsinline preload="metadata"></video>
      <div class="badge" id="badge">Idle</div>
    </div>
  </div>
  <div class="controls">
    <button class="btn active" data-state="idle">Idle</button>
    <button class="btn" data-state="thinking">Think</button>
    <button class="btn" data-state="talking">Talk</button>
  </div>
</div>

<script>
  const videos = {
    idle: document.getElementById('v-idle'),
    thinking: document.getElementById('v-thinking'),
    talking: document.getElementById('v-talking')
  };
  const badge = document.getElementById('badge');
  const buttons = document.querySelectorAll('.btn');
  let current = 'idle';
  let primed = false;

  function primeAll() {
    if (primed) return; primed = true;
    ['thinking','talking'].forEach(n => {
      const v = videos[n]; const p = v.play();
      if (p && p.then) p.then(() => setTimeout(() => { v.pause(); v.currentTime = 0; }, 50)).catch(()=>{});
    });
  }
  function setState(state) {
    if (state === current && videos[state].classList.contains('active')) return;
    current = state;
    Object.keys(videos).forEach(k => { if (k !== state) { videos[k].classList.remove('active'); videos[k].pause(); } });
    const a = videos[state];
    if (a.readyState === 0) a.load();
    a.currentTime = 0; a.classList.add('active');
    a.play().catch(() => setTimeout(() => a.play().catch(()=>{}), 100));
    badge.textContent = state.charAt(0).toUpperCase() + state.slice(1);
    buttons.forEach(b => b.classList.toggle('active', b.dataset.state === state));
  }
  buttons.forEach(b => b.addEventListener('click', e => { e.preventDefault(); primeAll(); setState(b.dataset.state); }));
  document.body.addEventListener('touchstart', () => { primeAll(); if (videos.idle.paused) videos.idle.play().catch(()=>{}); }, { once: true });
  window.addEventListener('load', () => videos.idle.play().catch(()=>{}));

  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  const menuOverlay = document.getElementById('menuOverlay');
  function openMenu() { menuPanel.classList.add('open'); menuOverlay.classList.add('open'); }
  function closeMenu() { menuPanel.classList.remove('open'); menuOverlay.classList.remove('open'); }
  menuBtn.addEventListener('click', e => { e.stopPropagation(); openMenu(); });
  menuOverlay.addEventListener('click', closeMenu);

  function openModal(id) { closeMenu(); document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); document.getElementById(id).classList.add('show'); }
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('.modal').classList.remove('show')));

  const WMO = {0:['☀️','Clear'],1:['🌤️','Mainly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Severe']};
  const wLoc = document.getElementById('wLoc'); const wContent = document.getElementById('wContent');
  document.getElementById('mWeather').addEventListener('click', () => { openModal('weatherModal'); loadWeather(); });

  function loadWeather() {
    wLoc.textContent = 'Detecting...';
    wContent.innerHTML = '<div style="text-align:center;padding:10px;color:#c8a8ff;">Getting location...</div>';
    const fallback = () => fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>fetchWeather(d.latitude,d.longitude,d.city,d.country_name)).catch(()=>wContent.innerHTML='<div style="text-align:center;color:#ff8080;">Location unavailable</div>');
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>fetchWeather(p.coords.latitude,p.coords.longitude), fallback, {timeout:8000});
    else fallback();
  }
  async function fetchWeather(lat, lon, city, country) {
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`);
      const d = await r.json(); const c = d.current;
      let loc = city ? `${city}${country?', '+country:''}` : 'Your Location';
      if (!city) { try { const g = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)).json(); loc = g.city || g.locality || g.principalSubdivision || 'Your Location'; } catch(e){} }
      wLoc.textContent = loc;
      const [icon, desc] = WMO[c.weather_code] || ['🌡️','Weather'];
      wContent.innerHTML = `<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;"><div style="font-size:3rem;">${icon}</div><div><div style="font-size:2.2rem;font-weight:300;">${Math.round(c.temperature_2m)}°C</div><div style="font-size:0.85rem;color:rgba(200,160,255,0.8);">${desc}</div></div></div><div style="display:flex;justify-content:space-between;border-top:1px solid rgba(160,100,255,0.3);padding-top:12px;font-size:0.75rem;color:rgba(200,160,255,0.8);"><div style="display:flex;flex-direction:column;gap:3px;">Humidity<span style="color:#fff;font-weight:700;font-size:1rem;">${c.relative_humidity_2m}%</span></div><div style="display:flex;flex-direction:column;gap:3px;">Wind<span style="color:#fff;font-weight:700;font-size:1rem;">${Math.round(c.wind_speed_10m)} km/h</span></div></div>`;
    } catch(e) { wContent.innerHTML = '<div style="text-align:center;color:#ff8080;">Weather unavailable</div>'; }
  }

  document.getElementById('mSettings').addEventListener('click', () => { openModal('settingsModal'); loadSettings(); });
  function loadSettings() {
    const name = localStorage.getItem('myraa_name') || '';
    document.getElementById('userName').value = name;
    const voice = localStorage.getItem('myraa_voice') === 'true';
    document.getElementById('voiceToggle').classList.toggle('on', voice);
    const theme = localStorage.getItem('myraa_theme') || 'purple';
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
  }
  document.getElementById('voiceToggle').addEventListener('click', function() { this.classList.toggle('on'); });
  document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.theme-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  }));
  document.getElementById('saveSettings').addEventListener('click', () => {
    localStorage.setItem('myraa_name', document.getElementById('userName').value);
    localStorage.setItem('myraa_voice', document.getElementById('voiceToggle').classList.contains('on'));
    const theme = document.querySelector('.theme-btn.active').dataset.theme;
    localStorage.setItem('myraa_theme', theme);
    applyTheme(theme);
    alert('Settings saved!');
    document.getElementById('settingsModal').classList.remove('show');
  });
  function applyTheme(theme) {
    document.body.classList.remove('theme-blue','theme-green');
    if (theme === 'blue') document.body.classList.add('theme-blue');
    if (theme === 'green') document.body.classList.add('theme-green');
  }

  document.getElementById('mScanner').addEventListener('click', () => openModal('scannerModal'));
  document.getElementById('startScan').addEventListener('click', () => {
    const circle = document.getElementById('scanCircle');
    const status = document.getElementById('scanStatus');
    const result = document.getElementById('scanResult');
    circle.classList.add('scanning');
    circle.textContent = '🔍';
    status.textContent = 'Scanning...';
    result.innerHTML = '';
    const steps = ['Checking system...', 'Scanning files...', 'Analyzing processes...', 'Checking network...', 'Finalizing...'];
    let i = 0;
    const int = setInterval(() => {
      status.textContent = steps[i++];
      if (i >= steps.length) {
        clearInterval(int);
        circle.classList.remove('scanning');
        circle.textContent = '✅';
        status.textContent = 'Scan complete';
        result.innerHTML = '<div class="scan-result">🛡️ <strong>No threats found</strong><br>Your device is secure.</div>';
      }
    }, 800);
  });
  document.getElementById('scanURL').addEventListener('click', () => {
    const url = prompt('Enter URL to scan:');
    if (!url) return;
    const result = document.getElementById('scanResult');
    result.innerHTML = '<div style="text-align:center;padding:14px;color:#c8a8ff;">Scanning URL...</div>';
    setTimeout(() => {
      const safe = !/(bit\.ly|tinyurl|free-|crypto|hack|\.tk|\.ml|\.ga)/i.test(url);
      if (safe) result.innerHTML = '<div class="scan-result">✅ <strong>Safe</strong><br>URL looks legitimate.</div>';
      else result.innerHTML = '<div class="scan-result" style="background:rgba(255,80,80,0.15);border-color:rgba(255,80,80,0.5);color:#ffb0b0;">⚠️ <strong>Suspicious</strong><br>Avoid opening.</div>';
    }, 1200);
  });

  document.getElementById('mAtoz').addEventListener('click', () => { openModal('atozModal'); buildAtoz(); });
  const atozData = {
    A: 'A for AI — Myraa ka brain.', B: 'B for Browser — Internet browsing.', C: 'C for Chat — Baat karne wala mode.',
    D: 'D for Data — Memory system.', E: 'E for Emotion — Mood detect.', F: 'F for Face — Animated character.',
    G: 'G for Gemini — Google ka AI brain.', H: 'H for Help — Commands list.', I: 'I for Internet — Web access.',
    J: 'J for Jokes — Funny replies.', K: 'K for Knowledge — General info.', L: 'L for Language — Hindi + English.',
    M: 'M for Memory — Long-term yaad.', N: 'N for News — Daily updates.', O: 'O for Organize — Tasks management.',
    P: 'P for Personal — Tere hisaab se bane.', Q: 'Q for Quick — Fast replies.', R: 'R for Reminder — Alerts aur timers.',
    S: 'S for Scanner — Security check.', T: 'T for Talking — Voice mode.', U: 'U for Updates — New features.',
    V: 'V for Voice — Bolna aur sunna.', W: 'W for Weather — Mausam.', X: 'X for eXtra — Surprise features.',
    Y: 'Y for You — Sab tere liye.', Z: 'Z for Zen — Calm aur peaceful.'
  };
  function buildAtoz() {
    const grid = document.getElementById('atozGrid');
    if (grid.children.length) return;
    Object.keys(atozData).forEach(l => {
      const b = document.createElement('button');
      b.className = 'atoz-letter';
      b.textContent = l;
      b.addEventListener('click', () => { document.getElementById('atozDetail').textContent = atozData[l]; });
      grid.appendChild(b);
    });
  }

  document.getElementById('mStats').addEventListener('click', () => { openModal('statsModal'); loadStats(); });
  function loadStats() {
    let first = localStorage.getItem('myraa_first');
    if (!first) { first = Date.now(); localStorage.setItem('myraa_first', first); }
    const days = Math.max(1, Math.ceil((Date.now() - first) / 86400000));
    const sessions = parseInt(localStorage.getItem('myraa_sessions') || '0') + 1;
    localStorage.setItem('myraa_sessions', sessions);
    document.getElementById('statFirst').textContent = new Date(first).toLocaleDateString();
    document.getElementById('statDays').textContent = days;
    document.getElementById('statSessions').textContent = sessions;
  }
  document.getElementById('resetStats').addEventListener('click', () => {
    if (confirm('Reset all data?')) { localStorage.clear(); location.reload(); }
  });

  document.getElementById('mShare').addEventListener('click', async () => {
    closeMenu();
    const url = window.location.href;
    if (navigator.share) { try { await navigator.share({ title: 'Myraa', url }); } catch(e){} }
    else { try { await navigator.clipboard.writeText(url); alert('Link copied!'); } catch(e){ alert(url); } }
  });

  document.getElementById('mAbout').addEventListener('click', () => openModal('aboutModal'));

  applyTheme(localStorage.getItem('myraa_theme') || 'purple');
</script>

</body>
