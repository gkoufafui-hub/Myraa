<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myraa - Personal AI Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(160, 60, 255, 0.15), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(100, 100, 255, 0.1), transparent 50%);
    }

    .myraa-container {
      text-align: center;
      animation: fadeIn 1.5s ease;
    }

    .myraa-logo {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(180, 100, 255, 0.6);
      box-shadow: 
        0 0 60px rgba(180, 100, 255, 0.4),
        0 0 120px rgba(180, 100, 255, 0.2);
      animation: pulse 3s ease-in-out infinite;
    }

    .myraa-name {
      font-size: 3rem;
      margin-top: 2rem;
      background: linear-gradient(135deg, #d89aff, #a060ff, #6b8aff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.2rem;
      font-weight: 300;
    }

    .myraa-tagline {
      font-size: 1rem;
      color: rgba(200, 160, 255, 0.6);
      margin-top: 0.5rem;
      letter-spacing: 0.3rem;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { 
        box-shadow: 0 0 60px rgba(180, 100, 255, 0.4), 
                    0 0 120px rgba(180, 100, 255, 0.2); 
      }
      50% { 
        box-shadow: 0 0 80px rgba(180, 100, 255, 0.7), 
                    0 0 160px rgba(180, 100, 255, 0.35); 
      }
    }
  </style>
</head>
<body>
  <div class="myraa-container">
    <img src="logo.png" alt="Myraa" class="myraa-logo">
    <h1 class="myraa-name">Myraa</h1>
    <p class="myraa-tagline">Personal AI Companion</p>
  </div>
</body>
</html>
