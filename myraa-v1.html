<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Myraa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #05030a;
    color: #fff;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      radial-gradient(circle at 50% 30%, rgba(160, 60, 255, 0.2), transparent 60%),
      linear-gradient(#05030a, #0a0518);
  }

  .app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 22px;
    position: relative;
  }

  /* Top bar */
  .top-bar {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: #c8a8ff;
    text-transform: uppercase;
    font-weight: 600;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #b580ff;
    box-shadow: 0 0 12px #b580ff;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }

  /* 3-dot menu button */
  .menu-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(20, 10, 40, 0.7);
    border: 1px solid rgba(160, 100, 255, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.25s ease;
    padding: 0;
  }
  .menu-btn:active { transform: scale(0.92); background: rgba(120, 60, 200, 0.4); }
  .menu-btn .bar {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #d8b8ff;
    box-shadow: 0 0 6px rgba(216, 184, 255, 0.8);
  }

  /* Slide-in menu */
  .menu-panel {
    position: fixed;
    top: 0;
    right: -300px;
    width: 260px;
    height: 100vh;
    background: rgba(15, 8, 30, 0.96);
    border-left: 1px solid rgba(160, 100, 255, 0.3);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 70px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: -10px 0 40px rgba(0, 0, 0, 0.6);
  }
  .menu-panel.open { right: 0; }

  .menu-title {
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    color: rgba(200, 160, 255, 0.6);
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(120, 60, 200, 0.1);
    border: 1px solid rgba(160, 100, 255, 0.2);
    color: #c8a8ff;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
    text-align: left;
    width: 100%;
  }
  .menu-item:active {
    background: rgba(160, 90, 255, 0.3);
    border-color: rgba(200, 140, 255, 0.7);
    color: #fff;
    transform: scale(0.98);
  }
  .menu-icon { font-size: 1.1rem; }

  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 99;
    backdrop-filter: blur(2px);
  }
  .menu-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Character stage */
  .stage {
    position: relative;
    width: min(72vw, 300px);
    aspect-ratio: 9 / 16;
    flex-shrink: 0;
  }

  .ring {
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 1px solid rgba(180, 120, 255, 0.3);
    border-top-color: rgba(200, 140, 255, 0.9);
    animation: spin 6s linear infinite;
    pointer-events: none;
  }
  .ring2 {
    inset: -32px;
    border: 1px dashed rgba(160, 100, 255, 0.25);
    border-top-color: transparent;
    animation: spin 12s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 22px;
    overflow: hidden;
    border: 1.5px solid rgba(180, 120, 255, 0.55);
    box-shadow:
      0 0 50px rgba(180, 100, 255, 0.45),
      inset 0 0 20px rgba(160, 80, 255, 0.15);
    background: #0a0418;
    animation: glow 4s ease-in-out infinite;
  }
  @keyframes glow {
    50% {
      box-shadow:
        0 0 70px rgba(180, 100, 255, 0.7),
        inset 0 0 30px rgba(160, 80, 255, 0.25);
    }
  }

  .video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }
  .video.active { opacity: 1; }

  .corner {
    position: absolute;
    width: 20px; height: 20px;
    border: 2px solid rgba(200, 140, 255, 0.9);
    z-index: 5;
    pointer-events: none;
  }
  .tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
  .tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
  .bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
  .br { bottom: 10px; right: 10px; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }

  .badge {
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 8, 40, 0.95);
    border: 1px solid rgba(180, 120, 255, 0.6);
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: #d8b8ff;
    text-transform: uppercase;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 0 20px rgba(180, 100, 255, 0.5);
    z-index: 6;
  }

  /* Weather card */
  .weather-card {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    width: min(88vw, 340px);
    background: rgba(15, 8, 30, 0.95);
    border: 1px solid rgba(160, 100, 255, 0.4);
    border-radius: 18px;
    padding: 16px 18px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 95;
    opacity: 0;
    pointer-events: none;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 10px 40px rgba(120, 60, 200, 0.35);
  }
  .weather-card.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  .weather-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .weather-loc {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: #c8a8ff;
    text-transform: uppercase;
    font-weight: 600;
  }
  .weather-close {
    background: transparent;
    border: none;
    color: #c8a8ff;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    width: 24px;
    height: 24px;
  }

  .weather-main {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  .weather-icon { font-size: 2.6rem; line-height: 1; }
  .weather-temp { font-size: 2rem; font-weight: 300; color: #fff; }
  .weather-desc { font-size: 0.8rem; color: rgba(200, 160, 255, 0.75); margin-top: 2px; }

  .weather-details {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid rgba(160, 100, 255, 0.2);
    padding-top: 10px;
    font-size: 0.7rem;
    color: rgba(200, 160, 255, 0.7);
  }
  .weather-details div { display: flex; flex-direction: column; gap: 2px; }
  .weather-details span { color: #d8b8ff; font-weight: 600; font-size: 0.85rem; }

  .weather-loading {
    text-align: center;
    font-size: 0.8rem;
    color: rgba(200, 160, 255, 0.6);
    padding: 10px;
  }

  /* Controls */
  .controls {
    width: 100%;
    max-width: 340px;
    background: rgba(20, 10, 40, 0.6);
    border: 1px solid rgba(160, 100, 255, 0.3);
    border-radius: 16px;
    padding: 12px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn {
    flex: 1;
    background: rgba(120, 60, 200, 0.15);
    border: 1px solid rgba(180, 120, 255, 0.35);
    color: #c8a8ff;
    padding: 12px 6px;
    border-radius: 10px;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .btn.active {
    background: rgba(180, 100, 255, 0.4);
    border-color: rgba(200, 140, 255, 0.9);
    color: #fff;
    box-shadow: 0 0 18px rgba(180, 100, 255, 0.55);
  }
  .btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand">
    <div class="dot"></div>
    <span>Myraa System</span>
  </div>
  <button class="menu-btn" id="menuBtn" aria-label="Menu">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </button>
</div>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="menu-panel" id="menuPanel">
  <div class="menu-title">Menu</div>
  <button class="menu-item" id="weatherMenuBtn">
    <span class="menu-icon">🌤️</span>
    <span>Weather</span>
  </button>
  <button class="menu-item" onclick="alert('Settings coming soon!')">
    <span class="menu-icon">⚙️</span>
    <span>Settings</span>
  </button>
  <button class="menu-item" onclick="alert('Myraa v0.1 — Personal AI Companion 💜')">
    <span class="menu-icon">ℹ️</span>
    <span>About Myraa</span>
  </button>
  <button class="menu-item" id="shareBtn">
    <span class="menu-icon">🔗</span>
    <span>Share</span>
  </button>
</div>

<div class="weather-card" id="weatherCard">
  <div class="weather-header">
    <div class="weather-loc" id="weatherLoc">Loading...</div>
    <button class="weather-close" id="weatherClose">✕</button>
  </div>
  <div id="weatherContent">
    <div class="weather-loading">Detecting location...</div>
  </div>
</div>

<div class="app">
  <div class="stage">
    <div class="ring"></div>
    <div class="ring ring2"></div>
    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <video id="v-idle" class="video active"
        src="Anime_girl_sitting_peacefully_20260923183801.mp4"
        autoplay loop muted playsinline preload="auto"></video>

      <video id="v-thinking" class="video"
        src="Anime_girl_thinking_with_particles_20260923183915.mp4"
        loop muted playsinline preload="metadata"></video>

      <video id="v-talking" class="video"
        src="Anime_girl_talking_to_camera_20260923184106.mp4"
        loop muted playsinline preload="metadata"></video>

      <div class="badge" id="badge">Idle</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn active" data-state="idle">Idle</button>
    <button class="btn" data-state="thinking">Think</button>
    <button class="btn" data-state="talking">Talk</button>
  </div>
</div>

<script>
  /* ========== State machine ========== */
  const videos = {
    idle: document.getElementById('v-idle'),
    thinking: document.getElementById('v-thinking'),
    talking: document.getElementById('v-talking')
  };
  const badge = document.getElementById('badge');
  const buttons = document.querySelectorAll('.btn');

  let current = 'idle';
  let primed = false;

  function primeAllVideos() {
    if (primed) return;
    primed = true;
    Object.entries(videos).forEach(([name, v]) => {
      if (name === 'idle') return;
      const p = v.play();
      if (p && p.then) {
        p.then(() => setTimeout(() => { v.pause(); v.currentTime = 0; }, 50)).catch(() => {});
      }
    });
  }

  function setState(state) {
    if (state === current && videos[state].classList.contains('active')) return;
    current = state;

    Object.entries(videos).forEach(([name, v]) => {
      if (name !== state) { v.classList.remove('active'); v.pause(); }
    });

    const active = videos[state];
    if (active.readyState === 0) active.load();
    active.currentTime = 0;
    active.classList.add('active');
    active.play().catch(() => setTimeout(() => active.play().catch(() => {}), 100));

    badge.textContent = state.charAt(0).toUpperCase() + state.slice(1);
    buttons.forEach(b => b.classList.toggle('active', b.dataset.state === state));
  }

  buttons.forEach(b => {
    b.addEventListener('click', (e) => { e.preventDefault(); primeAllVideos(); setState(b.dataset.state); });
    b.addEventListener('touchstart', () => primeAllVideos(), { passive: true });
  });

  document.body.addEventListener('touchstart', () => {
    primeAllVideos();
    if (videos.idle.paused) videos.idle.play().catch(() => {});
  }, { once: true });

  window.addEventListener('load', () => videos.idle.play().catch(() => {}));

  /* ========== Menu ========== */
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  const menuOverlay = document.getElementById('menuOverlay');

  function openMenu() { menuPanel.classList.add('open'); menuOverlay.classList.add('open'); }
  function closeMenu() { menuPanel.classList.remove('open'); menuOverlay.classList.remove('open'); }

  menuBtn.addEventListener('click', openMenu);
  menuOverlay.addEventListener('click', closeMenu);

  /* ========== Share ========== */
  document.getElementById('shareBtn').addEventListener('click', async () => {
    closeMenu();
    const url = window.location.href;
    if (navigator.share) {
      try { await navigator.share({ title: 'Myraa', text: 'Check out Myraa — my AI companion!', url }); } catch (e) {}
    } else {
      try { await navigator.clipboard.writeText(url); alert('Link copied!'); } catch (e) { alert(url); }
    }
  });

  /* ========== Weather ========== */
  const weatherMenuBtn = document.getElementById('weatherMenuBtn');
  const weatherCard = document.getElementById('weatherCard');
  const weatherClose = document.getElementById('weatherClose');
  const weatherLoc = document.getElementById('weatherLoc');
  const weatherContent = document.getElementById('weatherContent');

  const WMO = {
    0:  ['☀️', 'Clear sky'],
    1:  ['🌤️', 'Mainly clear'],
    2:  ['⛅', 'Partly cloudy'],
    3:  ['☁️', 'Overcast'],
    45: ['🌫️', 'Foggy'],
    48: ['🌫️', 'Freezing fog'],
    51: ['🌦️', 'Light drizzle'],
    53: ['🌦️', 'Drizzle'],
    55: ['🌧️', 'Heavy drizzle'],
    61: ['🌧️', 'Light rain'],
    63: ['🌧️', 'Rain'],
    65: ['🌧️', 'Heavy rain'],
    71: ['🌨️', 'Light snow'],
    73: ['🌨️', 'Snow'],
    75: ['❄️', 'Heavy snow'],
    80: ['🌦️', 'Rain showers'],
    81: ['🌧️', 'Heavy showers'],
    82: ['⛈️', 'Violent showers'],
    95: ['⛈️', 'Thunderstorm'],
    96: ['⛈️', 'Thunderstorm + hail'],
    99: ['⛈️', 'Severe thunderstorm']
  };

  weatherMenuBtn.addEventListener('click', () => {
    closeMenu();
    weatherCard.classList.add('show');
    loadWeather();
  });

  weatherClose.addEventListener('click', () => weatherCard.classList.remove('show'));

  async function loadWeather() {
    weatherLoc.textContent = 'Detecting...';
    weatherContent.innerHTML = '<div class="weather-loading">Getting your location...</div>';

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
        () => {
          fetch('https://ipapi.co/json/')
            .then(r => r.json())
            .then(d => fetchWeather(d.latitude, d.longitude, d.city, d.country_name))
            .catch(() => showWeatherError('Location unavailable'));
        },
        { timeout: 8000, enableHighAccuracy: false }
      );
    } else {
      fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(d => fetchWeather(d.latitude, d.longitude, d.city, d.country_name))
        .catch(() => showWeatherError('Location unavailable'));
    }
  }

  async function fetchWeather(lat, lon, cityName, countryName) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;
      const res = await fetch(url);
      const data = await res.json();
      const c = data.current;

      let loc = cityName ? `${cityName}${countryName ? ', ' + countryName : ''}` : 'Your Location';
      if (!cityName) {
        try {
          const geo = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
          const g = await geo.json();
          loc = g.city || g.locality || g.principalSubdivision || 'Your Location';
        } catch (e) {}
      }

      weatherLoc.textContent = loc;
      const [icon, desc] = WMO[c.weather_code] || ['🌡️', 'Weather'];

      weatherContent.innerHTML = `
        <div class="weather-main">
          <div class="weather-icon">${icon}</div>
          <div>
            <div class="weather-temp">${Math.round(c.temperature_2m)}°C</div>
            <div class="weather-desc">${desc}</div>
          </div>
        </div>
        <div class="weather-details">
          <div>Humidity<span>${c.relative_humidity_2m}%</span></div>
          <div>Wind<span>${Math.round(c.wind_speed_10m)} km/h</span></div>
          <div>Feels<span>${Math.round(c.temperature_2m)}°C</span></div>
        </div>
      `;
    } catch (e) {
      showWeatherError('Weather unavailable');
    }
  }

  function showWeatherError(msg) {
    weatherLoc.textContent = 'Error';
    weatherContent.innerHTML = `<div class="weather-loading">${msg}</div>`;
  }
</script>

</body>
  </html>
