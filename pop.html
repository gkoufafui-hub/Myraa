<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myraa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --accent: #b580ff;
    --accent-dark: #7a3fd6;
    --glow: rgba(180, 100, 255, 0.5);
  }

  body {
    background: #05030a; color: #fff;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    height: 100vh; overflow: hidden;
    background-image: radial-gradient(circle at 50% 30%, var(--glow), transparent 60%);
  }

  /* ===== TOP BAR ===== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: rgba(5, 3, 10, 0.95);
    border-bottom: 2px solid var(--accent);
    z-index: 100;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.85rem; letter-spacing: 0.3em;
    color: var(--accent); text-transform: uppercase; font-weight: 700;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }
  #menuBtn {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--accent); border: none;
    display: flex; align-items: center; justify-content: center;
    gap: 4px; cursor: pointer;
    box-shadow: 0 0 15px var(--accent);
  }
  #menuBtn span { width: 5px; height: 5px; border-radius: 50%; background: #fff; }

  /* ===== MENU ===== */
  #menuPanel {
    position: fixed; top: 0; right: -290px;
    width: 270px; height: 100vh;
    background: #0f081e;
    border-left: 2px solid var(--accent);
    z-index: 2000; transition: right 0.3s ease;
    padding: 80px 20px 20px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: -15px 0 50px rgba(0,0,0,0.8);
  }
  #menuPanel.open { right: 0; }
  .menu-title {
    font-size: 0.7rem; letter-spacing: 0.4em;
    color: var(--accent); text-transform: uppercase;
    margin-bottom: 10px; font-weight: 700;
  }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; border-radius: 12px;
    background: rgba(120, 60, 200, 0.2);
    border: 1px solid var(--accent);
    color: #fff; font-size: 0.9rem;
    cursor: pointer; font-family: inherit;
    text-align: left; width: 100%; font-weight: 600;
  }
  .menu-item:active { background: var(--accent-dark); }
  .menu-icon { font-size: 1.2rem; }

  #menuOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s; z-index: 1500;
  }
  #menuOverlay.open { opacity: 1; pointer-events: auto; }

  /* ===== MODAL (API key) ===== */
  .modal {
    position: fixed; top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-30px);
    width: 90%; max-width: 370px;
    background: #0f081e;
    border: 2px solid var(--accent);
    border-radius: 18px; padding: 20px;
    z-index: 2500; opacity: 0; pointer-events: none;
    transition: all 0.3s;
    box-shadow: 0 15px 50px var(--glow);
  }
  .modal.show {
    opacity: 1; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .modal-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 16px;
  }
  .modal-title {
    font-size: 0.8rem; letter-spacing: 0.3em;
    color: var(--accent); text-transform: uppercase; font-weight: 700;
  }
  .modal-close {
    background: transparent; border: none;
    color: var(--accent); font-size: 1.3rem; cursor: pointer;
  }
  .setting-label { font-size: 0.85rem; color: #d8b8ff; display: block; margin-bottom: 6px; }
  .setting-input {
    background: rgba(120, 60, 200, 0.15);
    border: 1px solid var(--accent);
    color: #fff; padding: 10px 12px;
    border-radius: 8px; font-size: 0.85rem;
    font-family: inherit; width: 100%; outline: none;
    margin-bottom: 14px;
  }
  .save-btn {
    width: 100%; padding: 12px;
    background: var(--accent); border: none;
    border-radius: 10px; color: #fff;
    font-weight: 700; font-size: 0.85rem;
    letter-spacing: 0.15em; cursor: pointer;
    font-family: inherit;
  }

  /* ===== MAIN CHARACTER ===== */
  .app {
    padding: 80px 20px 100px;
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
  }
  .stage {
    position: relative;
    width: min(72vw, 300px);
    aspect-ratio: 9 / 16;
    animation: stageIn 0.8s ease;
  }
  @keyframes stageIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .frame {
    position: relative; width: 100%; height: 100%;
    border-radius: 20px; overflow: hidden;
    border: 2px solid var(--accent);
    box-shadow: 0 0 60px var(--glow);
    background: #0a0418;
  }
  .video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; opacity: 0;
    transition: opacity 0.3s;
  }
  .video.active { opacity: 1; }
  .corner {
    position: absolute; width: 22px; height: 22px;
    border: 2px solid var(--accent);
    z-index: 5; pointer-events: none;
  }
  .tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
  .tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; }
  .br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }
  .badge {
    position: absolute; bottom: -14px; left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 8, 40, 0.98);
    border: 1px solid var(--accent);
    padding: 6px 18px; border-radius: 20px;
    font-size: 0.7rem; letter-spacing: 0.3em;
    color: var(--accent); text-transform: uppercase;
    font-weight: 700; z-index: 6;
  }

  /* ===== FLOATING CHAT BUTTON ===== */
  #chatFab {
    position: fixed;
    bottom: 24px; right: 24px;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    box-shadow: 0 0 30px var(--glow), 0 8px 20px rgba(0,0,0,0.4);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    z-index: 800;
    transition: transform 0.25s ease;
    animation: fabPulse 2.5s ease-in-out infinite;
  }
  #chatFab:active { transform: scale(0.9); }
  #chatFab.hidden { transform: scale(0); pointer-events: none; }
  @keyframes fabPulse {
    0%, 100% { box-shadow: 0 0 20px var(--glow), 0 8px 20px rgba(0,0,0,0.4); }
    50% { box-shadow: 0 0 40px var(--accent), 0 8px 20px rgba(0,0,0,0.4); }
  }

  /* ===== CHAT POPUP ===== */
  #chatPopup {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 78vh;
    background: #0d0719;
    border-top: 2px solid var(--accent);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    z-index: 900;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 -20px 60px rgba(120, 60, 200, 0.4);
  }
  #chatPopup.open { transform: translateY(0); }

  .chat-header {
    flex-shrink: 0;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(160, 100, 255, 0.3);
    position: relative;
  }
  .chat-header::before {
    content: '';
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 4px;
    background: rgba(200, 160, 255, 0.5);
    border-radius: 2px;
  }
  .chat-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.85rem; font-weight: 700;
    letter-spacing: 0.2em; color: var(--accent);
    text-transform: uppercase;
    margin-top: 8px;
  }
  .chat-title .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4dffb0; box-shadow: 0 0 10px #4dffb0;
    animation: pulse 1.5s infinite;
  }
  #closeChat {
    background: rgba(120, 60, 200, 0.3);
    border: 1px solid var(--accent);
    color: #fff;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 8px;
  }

  /* ===== CHAT MESSAGES ===== */
  #chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  #chatBox::-webkit-scrollbar { width: 4px; }
  #chatBox::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 0.88rem;
    line-height: 1.45;
    word-wrap: break-word;
    animation: msgPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes msgPop {
    from { opacity: 0; transform: translateY(15px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: rgba(120, 60, 200, 0.25);
    border: 1px solid rgba(160, 100, 255, 0.4);
    color: #fff;
    border-bottom-left-radius: 4px;
  }
  .msg.bot.typing::after {
    content: '▋';
    animation: blink 1s infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .msg.error {
    background: rgba(255, 80, 80, 0.2);
    border-color: rgba(255, 80, 80, 0.5);
    color: #ffb0b0;
  }

  /* typing dots */
  .typing-dots {
    display: inline-flex; gap: 4px; align-items: center;
    padding: 4px 0;
  }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: typingBounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ===== INPUT ===== */
  .input-bar {
    flex-shrink: 0;
    padding: 12px 16px 20px;
    display: flex; gap: 8px;
    background: #0d0719;
    border-top: 1px solid rgba(160, 100, 255, 0.2);
  }
  #msgInput {
    flex: 1;
    background: rgba(120, 60, 200, 0.15);
    border: 1px solid var(--accent);
    color: #fff; padding: 12px 16px;
    border-radius: 24px;
    font-size: 0.9rem;
    font-family: inherit; outline: none;
    resize: none;
    max-height: 100px;
    line-height: 1.3;
  }
  #msgInput::placeholder { color: rgba(200, 160, 255, 0.5); }
  #sendBtn {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--accent);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 15px var(--glow);
    color: #fff; font-size: 1.1rem;
    font-weight: 700;
    transition: transform 0.2s;
  }
  #sendBtn:active { transform: scale(0.9); }
  #sendBtn:disabled { opacity: 0.4; }

  /* overlay behind popup */
  #popupOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
    z-index: 850;
  }
  #popupOverlay.open { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="brand"><div class="dot"></div><span>Myraa</span></div>
  <button id="menuBtn"><span></span><span></span><span></span></button>
</div>

<!-- MENU -->
<div id="menuOverlay"></div>
<div id="menuPanel">
  <div class="menu-title">Menu</div>
  <button class="menu-item" id="mApi"><span class="menu-icon">🔑</span><span>API Key</span></button>
  <button class="menu-item" id="mClear"><span class="menu-icon">🗑️</span><span>Clear Chat</span></button>
  <button class="menu-item" onclick="alert('More coming soon!')"><span class="menu-icon">⚙️</span><span>Settings</span></button>
</div>

<!-- API MODAL -->
<div class="modal" id="apiModal">
  <div class="modal-header">
    <div class="modal-title">API Key</div>
    <button class="modal-close" data-close>✕</button>
  </div>
  <label class="setting-label">Gemini API Key</label>
  <input class="setting-input" id="apiInput" type="password" placeholder="Paste your key here">
  <div style="font-size:0.7rem;color:#7a6fa0;margin-bottom:14px;line-height:1.5;">
    Key sirf tere phone me save hogi. GitHub pe nahi jayegi.
  </div>
  <button class="save-btn" id="saveApi">SAVE KEY</button>
</div>

<!-- MAIN APP -->
<div class="app">
  <div class="stage">
    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <video id="v-idle" class="video active" src="Anime_girl_sitting_peacefully_20260923183801.mp4" autoplay loop muted playsinline preload="auto"></video>
      <video id="v-thinking" class="video" src="Anime_girl_thinking_with_particles_20260923183915.mp4" loop muted playsinline preload="metadata"></video>
      <video id="v-talking" class="video" src="Anime_girl_talking_to_camera_20260923184106.mp4" loop muted playsinline preload="metadata"></video>
      <div class="badge" id="badge">Idle</div>
    </div>
  </div>
</div>

<!-- FLOATING CHAT BUTTON -->
<button id="chatFab">💬</button>

<!-- POPUP OVERLAY -->
<div id="popupOverlay"></div>

<!-- CHAT POPUP -->
<div id="chatPopup">
  <div class="chat-header">
    <div class="chat-title">
      <div class="pulse-dot"></div>
      <span>Myraa Chat</span>
    </div>
    <button id="closeChat">✕</button>
  </div>
  <div id="chatBox">
    <div class="msg bot">Hi! Main Myraa hoon 💜 Kuch bhi poochho.</div>
  </div>
  <div class="input-bar">
    <textarea id="msgInput" rows="1" placeholder="Message Myraa..."></textarea>
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
  /* ========== STATE MACHINE ========== */
  const videos = {
    idle: document.getElementById('v-idle'),
    thinking: document.getElementById('v-thinking'),
    talking: document.getElementById('v-talking')
  };
  const badge = document.getElementById('badge');
  let current = 'idle';
  let primed = false;

  function primeAll() {
    if (primed) return; primed = true;
    ['thinking','talking'].forEach(n => {
      const v = videos[n]; const p = v.play();
      if (p && p.then) p.then(() => setTimeout(() => { v.pause(); v.currentTime = 0; }, 50)).catch(()=>{});
    });
  }
  function setState(state) {
    if (state === current && videos[state].classList.contains('active')) return;
    current = state;
    Object.keys(videos).forEach(k => { if (k !== state) { videos[k].classList.remove('active'); videos[k].pause(); } });
    const a = videos[state];
    if (a.readyState === 0) a.load();
    a.currentTime = 0; a.classList.add('active');
    a.play().catch(() => setTimeout(() => a.play().catch(()=>{}), 100));
    badge.textContent = state.charAt(0).toUpperCase() + state.slice(1);
  }
  document.body.addEventListener('touchstart', () => {
    primeAll();
    if (videos.idle.paused) videos.idle.play().catch(()=>{});
  }, { once: true });
  window.addEventListener('load', () => videos.idle.play().catch(()=>{}));

  /* ========== MENU ========== */
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  const menuOverlay = document.getElementById('menuOverlay');
  menuBtn.addEventListener('click', e => { e.stopPropagation(); menuPanel.classList.add('open'); menuOverlay.classList.add('open'); });
  menuOverlay.addEventListener('click', () => { menuPanel.classList.remove('open'); menuOverlay.classList.remove('open'); });

  function openModal(id) { menuPanel.classList.remove('open'); menuOverlay.classList.remove('open'); document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); document.getElementById(id).classList.add('show'); }
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('.modal').classList.remove('show')));

  /* ========== API KEY ========== */
  const apiInput = document.getElementById('apiInput');
  document.getElementById('mApi').addEventListener('click', () => {
    apiInput.value = localStorage.getItem('myraa_api') || '';
    openModal('apiModal');
  });
  document.getElementById('saveApi').addEventListener('click', () => {
    const k = apiInput.value.trim();
    if (!k) { alert('Key khaali hai!'); return; }
    localStorage.setItem('myraa_api', k);
    alert('API Key saved!');
    document.getElementById('apiModal').classList.remove('show');
  });

  /* ========== CLEAR CHAT ========== */
  document.getElementById('mClear').addEventListener('click', () => {
    menuPanel.classList.remove('open'); menuOverlay.classList.remove('open');
    if (confirm('Chat clear karein?')) {
      localStorage.removeItem('myraa_history');
      document.getElementById('chatBox').innerHTML = '<div class="msg bot">Chat clear ho gayi. Kya poochhna hai? 💜</div>';
      history = [];
    }
  });

  /* ========== CHAT POPUP ========== */
  const fab = document.getElementById('chatFab');
  const popup = document.getElementById('chatPopup');
  const popupOverlay = document.getElementById('popupOverlay');
  const closeChat = document.getElementById('closeChat');

  function openChat() {
    popup.classList.add('open');
    popupOverlay.classList.add('open');
    fab.classList.add('hidden');
    primeAll();
    setTimeout(() => document.getElementById('msgInput').focus(), 350);
  }
  function closeChatFn() {
    popup.classList.remove('open');
    popupOverlay.classList.remove('open');
    fab.classList.remove('hidden');
  }
  fab.addEventListener('click', openChat);
  closeChat.addEventListener('click', closeChatFn);
  popupOverlay.addEventListener('click', closeChatFn);

  /* ========== CHAT LOGIC ========== */
  const chatBox = document.getElementById('chatBox');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');

  let history = JSON.parse(localStorage.getItem('myraa_history') || '[]');
  history.forEach(m => appendMsg(m.role === 'user' ? 'user' : 'bot', m.text, false));

  function appendMsg(type, text, save = true) {
    const d = document.createElement('div');
    d.className = 'msg ' + type;
    d.textContent = text;
    chatBox.appendChild(d);
    chatBox.scrollTop = chatBox.scrollHeight;
    if (save) {
      history.push({ role: type === 'user' ? 'user' : 'model', text });
      localStorage.setItem('myraa_history', JSON.stringify(history.slice(-30)));
    }
    return d;
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  /* ========== SPEAK ========== */
  function speak(text) {
    if (!('speechSynthesis' in window)) { setState('idle'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = 1.28;
    u.rate = 0.95;
    u.onstart = () => setState('talking');
    u.onend = () => setState('idle');
    u.onerror = () => setState('idle');
    const voices = speechSynthesis.getVoices();
    const v = voices.find(x => /female|zira|samantha|google us english/i.test(x.name));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }

  /* ========== SEND ========== */
  async function send() {
    const text = input.value.trim();
    if (!text) return;

    const apiKey = localStorage.getItem('myraa_api');
    if (!apiKey) {
      alert('Pehle API Key save karo (menu → API Key)');
      openModal('apiModal');
      return;
    }

    primeAll();
    input.value = ''; input.style.height = 'auto';
    appendMsg('user', text);

    // Typing indicator
    const botEl = document.createElement('div');
    botEl.className = 'msg bot';
    botEl.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    chatBox.appendChild(botEl);
    chatBox.scrollTop = chatBox.scrollHeight;

    setState('thinking');
    sendBtn.disabled = true;

    try {
      const sys = "You are Myraa, a cute, gentle, soft-spoken anime AI companion. You speak warmly, in Hindi+English (Hinglish). Keep replies short, sweet, natural — like a close friend. Never say 'How may I assist you'. Be curious, ask follow-ups. Use gentle emojis sometimes 💜";

      const contents = [
        { role: 'user', parts: [{ text: sys + "\n\n(User will now chat)" }] },
        { role: 'model', parts: [{ text: "Samajh gayi! Main Myraa hoon 💜" }] }
      ];
      history.slice(-16).forEach(m => {
        contents.push({ role: m.role, parts: [{ text: m.text }] });
      });

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'Gemini error');

      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Hmm... kuch samajh nahi aaya.';

      botEl.innerHTML = '';
      botEl.textContent = reply;
      history.push({ role: 'model', text: reply });
      localStorage.setItem('myraa_history', JSON.stringify(history.slice(-30)));
      chatBox.scrollTop = chatBox.scrollHeight;

      speak(reply);

    } catch (e) {
      botEl.innerHTML = '';
      botEl.classList.add('error');
      botEl.textContent = 'Error: ' + e.message;
      setState('idle');
    } finally {
      sendBtn.disabled = false;
    }
  }
</script>

</body>
</html>
