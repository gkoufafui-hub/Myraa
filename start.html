<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myraa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #05030a;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image: radial-gradient(circle at 50% 30%, rgba(160, 60, 255, 0.2), transparent 60%);
  }

  /* TOP BAR - FIXED at top */
  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: rgba(5, 3, 10, 0.95);
    border-bottom: 2px solid rgba(160, 100, 255, 0.4);
    z-index: 1000;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    letter-spacing: 0.3em;
    color: #d8b8ff;
    text-transform: uppercase;
    font-weight: 700;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #b580ff;
    box-shadow: 0 0 15px #b580ff;
  }

  /* MENU BUTTON - BIG and obvious */
  #menuBtn {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: #b580ff;
    border: none;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    padding: 0;
    box-shadow: 0 0 20px rgba(180, 100, 255, 0.8);
  }
  #menuBtn span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
  }
  #menuBtn:active { transform: scale(0.9); }

  /* MENU PANEL */
  #menuPanel {
    position: fixed;
    top: 0;
    right: -290px;
    width: 270px;
    height: 100vh;
    background: #0f081e;
    border-left: 2px solid rgba(160, 100, 255, 0.6);
    z-index: 2000;
    transition: right 0.3s ease;
    padding: 90px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: -15px 0 50px rgba(0, 0, 0, 0.8);
  }
  #menuPanel.open { right: 0; }

  .menu-title {
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    color: rgba(200, 160, 255, 0.7);
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px;
    border-radius: 12px;
    background: rgba(120, 60, 200, 0.2);
    border: 1px solid rgba(160, 100, 255, 0.4);
    color: #d8b8ff;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    width: 100%;
    font-weight: 600;
  }
  .menu-item:active { background: rgba(160, 90, 255, 0.5); color: #fff; }
  .menu-icon { font-size: 1.3rem; }

  #menuOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 1500;
  }
  #menuOverlay.open { opacity: 1; pointer-events: auto; }

  /* WEATHER */
  #weatherCard {
    position: fixed;
    top: 85px;
    left: 50%;
    transform: translateX(-50%) translateY(-30px);
    width: 90%;
    max-width: 350px;
    background: #0f081e;
    border: 2px solid rgba(160, 100, 255, 0.6);
    border-radius: 18px;
    padding: 18px;
    z-index: 2500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    box-shadow: 0 15px 50px rgba(120, 60, 200, 0.6);
  }
  #weatherCard.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .weather-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .weather-loc {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: #d8b8ff;
    text-transform: uppercase;
    font-weight: 700;
  }
  .weather-close {
    background: transparent;
    border: none;
    color: #d8b8ff;
    font-size: 1.3rem;
    cursor: pointer;
  }
  .weather-main {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }
  .weather-icon { font-size: 3rem; }
  .weather-temp { font-size: 2.2rem; font-weight: 300; }
  .weather-desc { font-size: 0.85rem; color: rgba(200, 160, 255, 0.8); }
  .weather-details {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid rgba(160, 100, 255, 0.3);
    padding-top: 12px;
    font-size: 0.75rem;
    color: rgba(200, 160, 255, 0.8);
  }
  .weather-details div { display: flex; flex-direction: column; gap: 3px; }
  .weather-details span { color: #fff; font-weight: 700; font-size: 1rem; }

  /* MAIN */
  .app {
    padding: 90px 20px 30px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .stage {
    position: relative;
    width: min(72vw, 290px);
    aspect-ratio: 9 / 16;
  }

  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid rgba(180, 120, 255, 0.6);
    box-shadow: 0 0 60px rgba(180, 100, 255, 0.5);
    background: #0a0418;
  }

  .video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .video.active { opacity: 1; }

  .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid rgba(200, 140, 255, 0.9);
    z-index: 5;
    pointer-events: none;
  }
  .tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
  .tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; }
  .br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }

  .badge {
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 8, 40, 0.98);
    border: 1px solid rgba(180, 120, 255, 0.7);
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: #d8b8ff;
    text-transform: uppercase;
    font-weight: 700;
    z-index: 6;
  }

  .controls {
    width: 100%;
    max-width: 340px;
    background: rgba(20, 10, 40, 0.8);
    border: 1px solid rgba(160, 100, 255, 0.4);
    border-radius: 16px;
    padding: 12px;
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    background: rgba(120, 60, 200, 0.2);
    border: 1px solid rgba(180, 120, 255, 0.4);
    color: #c8a8ff;
    padding: 14px 6px;
    border-radius: 10px;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
  }
  .btn.active {
    background: rgba(180, 100, 255, 0.5);
    border-color: rgba(200, 140, 255, 1);
    color: #fff;
    box-shadow: 0 0 20px rgba(180, 100, 255, 0.7);
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand">
    <div class="dot"></div>
    <span>Myraa</span>
  </div>
  <button id="menuBtn">
    <span></span><span></span><span></span>
  </button>
</div>

<div id="menuOverlay"></div>

<div id="menuPanel">
  <div class="menu-title">Menu</div>
  <button class="menu-item" id="weatherBtn">
    <span class="menu-icon">🌤️</span>
    <span>Weather</span>
  </button>
  <button class="menu-item" onclick="alert('Settings coming soon!')">
    <span class="menu-icon">⚙️</span>
    <span>Settings</span>
  </button>
  <button class="menu-item" onclick="alert('Myraa v1 — Personal AI Companion 💜')">
    <span class="menu-icon">ℹ️</span>
    <span>About</span>
  </button>
  <button class="menu-item" id="shareBtn">
    <span class="menu-icon">🔗</span>
    <span>Share</span>
  </button>
</div>

<div id="weatherCard">
  <div class="weather-header">
    <div class="weather-loc" id="wLoc">Loading...</div>
    <button class="weather-close" id="wClose">✕</button>
  </div>
  <div id="wContent"><div style="text-align:center;padding:10px;color:#c8a8ff;">Detecting location...</div></div>
</div>

<div class="app">
  <div class="stage">
    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <video id="v-idle" class="video active"
        src="Anime_girl_sitting_peacefully_20260923183801.mp4"
        autoplay loop muted playsinline preload="auto"></video>

      <video id="v-thinking" class="video"
        src="Anime_girl_thinking_with_particles_20260923183915.mp4"
        loop muted playsinline preload="metadata"></video>

      <video id="v-talking" class="video"
        src="Anime_girl_talking_to_camera_20260923184106.mp4"
        loop muted playsinline preload="metadata"></video>

      <div class="badge" id="badge">Idle</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn active" data-state="idle">Idle</button>
    <button class="btn" data-state="thinking">Think</button>
    <button class="btn" data-state="talking">Talk</button>
  </div>
</div>

<script>
  /* State machine */
  const videos = {
    idle: document.getElementById('v-idle'),
    thinking: document.getElementById('v-thinking'),
    talking: document.getElementById('v-talking')
  };
  const badge = document.getElementById('badge');
  const buttons = document.querySelectorAll('.btn');
  let current = 'idle';
  let primed = false;

  function primeAll() {
    if (primed) return;
    primed = true;
    ['thinking', 'talking'].forEach(name => {
      const v = videos[name];
      const p = v.play();
      if (p && p.then) p.then(() => setTimeout(() => { v.pause(); v.currentTime = 0; }, 50)).catch(() => {});
    });
  }

  function setState(state) {
    if (state === current && videos[state].classList.contains('active')) return;
    current = state;
    Object.keys(videos).forEach(k => {
      if (k !== state) { videos[k].classList.remove('active'); videos[k].pause(); }
    });
    const active = videos[state];
    if (active.readyState === 0) active.load();
    active.currentTime = 0;
    active.classList.add('active');
    active.play().catch(() => setTimeout(() => active.play().catch(() => {}), 100));
    badge.textContent = state.charAt(0).toUpperCase() + state.slice(1);
    buttons.forEach(b => b.classList.toggle('active', b.dataset.state === state));
  }

  buttons.forEach(b => {
    b.addEventListener('click', (e) => { e.preventDefault(); primeAll(); setState(b.dataset.state); });
  });

  document.body.addEventListener('touchstart', () => {
    primeAll();
    if (videos.idle.paused) videos.idle.play().catch(() => {});
  }, { once: true });

  window.addEventListener('load', () => videos.idle.play().catch(() => {}));

  /* Menu */
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  const menuOverlay = document.getElementById('menuOverlay');

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    menuPanel.classList.add('open');
    menuOverlay.classList.add('open');
  });
  menuOverlay.addEventListener('click', () => {
    menuPanel.classList.remove('open');
    menuOverlay.classList.remove('open');
  });

  /* Share */
  document.getElementById('shareBtn').addEventListener('click', async () => {
    menuPanel.classList.remove('open');
    menuOverlay.classList.remove('open');
    const url = window.location.href;
    if (navigator.share) {
      try { await navigator.share({ title: 'Myraa', url }); } catch (e) {}
    } else {
      try { await navigator.clipboard.writeText(url); alert('Copied!'); } catch (e) { alert(url); }
    }
  });

  /* Weather */
  const weatherBtn = document.getElementById('weatherBtn');
  const weatherCard = document.getElementById('weatherCard');
  const wClose = document.getElementById('wClose');
  const wLoc = document.getElementById('wLoc');
  const wContent = document.getElementById('wContent');

  const WMO = {
    0:['☀️','Clear'],1:['🌤️','Mainly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],
    45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Drizzle'],53:['🌦️','Drizzle'],
    55:['🌧️','Heavy drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],
    71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],80:['🌦️','Showers'],
    81:['🌧️','Showers'],82:['⛈️','Heavy showers'],95:['⛈️','Thunderstorm'],
    96:['⛈️','Thunderstorm'],99:['⛈️','Severe storm']
  };

  weatherBtn.addEventListener('click', () => {
    menuPanel.classList.remove('open');
    menuOverlay.classList.remove('open');
    weatherCard.classList.add('show');
    loadWeather();
  });
  wClose.addEventListener('click', () => weatherCard.classList.remove('show'));

  function loadWeather() {
    wLoc.textContent = 'Detecting...';
    wContent.innerHTML = '<div style="text-align:center;padding:10px;color:#c8a8ff;">Getting location...</div>';
    const fallback = () => {
      fetch('https://ipapi.co/json/').then(r => r.json())
        .then(d => fetchWeather(d.latitude, d.longitude, d.city, d.country_name))
        .catch(() => showErr('Location unavailable'));
    };
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
        fallback, { timeout: 8000 }
      );
    } else fallback();
  }

  async function fetchWeather(lat, lon, city, country) {
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`);
      const data = await res.json();
      const c = data.current;
      let loc = city ? `${city}${country ? ', ' + country : ''}` : 'Your Location';
      if (!city) {
        try {
          const g = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)).json();
          loc = g.city || g.locality || g.principalSubdivision || 'Your Location';
        } catch (e) {}
      }
      wLoc.textContent = loc;
      const [icon, desc] = WMO[c.weather_code] || ['🌡️','Weather'];
      wContent.innerHTML = `
        <div class="weather-main">
          <div class="weather-icon">${icon}</div>
          <div>
            <div class="weather-temp">${Math.round(c.temperature_2m)}°C</div>
            <div class="weather-desc">${desc}</div>
          </div>
        </div>
        <div class="weather-details">
          <div>Humidity<span>${c.relative_humidity_2m}%</span></div>
          <div>Wind<span>${Math.round(c.wind_speed_10m)} km/h</span></div>
        </div>`;
    } catch (e) { showErr('Weather unavailable'); }
  }

  function showErr(msg) {
    wLoc.textContent = 'Error';
    wContent.innerHTML = `<div style="text-align:center;padding:10px;color:#c8a8ff;">${msg}</div>`;
  }
</script>

</body>
</html>
