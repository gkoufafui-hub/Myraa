<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myraa Live</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --accent: #b580ff; --accent-dark: #7a3fd6; --glow: rgba(180, 100, 255, 0.5); --danger: #ff5577; --green: #4dffb0; --emotion: #b580ff; --emotion-glow: rgba(180, 100, 255, 0.6); }
  body { background: #05030a; color: #fff; font-family: -apple-system, 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; background-image: radial-gradient(circle at 50% 30%, var(--emotion-glow), transparent 60%); transition: background-image 0.6s ease; }
  .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(5, 3, 10, 0.95); border-bottom: 2px solid var(--accent); z-index: 100; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; letter-spacing: 0.3em; color: var(--accent); text-transform: uppercase; font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  #menuBtn { width: 42px; height: 42px; border-radius: 12px; background: var(--accent); border: none; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; box-shadow: 0 0 15px var(--accent); }
  #menuBtn span { width: 5px; height: 5px; border-radius: 50%; background: #fff; }
  #menuPanel { position: fixed; top: 0; right: -290px; width: 270px; height: 100vh; background: #0f081e; border-left: 2px solid var(--accent); z-index: 2000; transition: right 0.3s ease; padding: 80px 20px 20px; display: flex; flex-direction: column; gap: 8px; box-shadow: -15px 0 50px rgba(0,0,0,0.8); overflow-y: auto; }
  #menuPanel.open { right: 0; }
  .menu-title { font-size: 0.7rem; letter-spacing: 0.4em; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; font-weight: 700; }
  .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(120, 60, 200, 0.2); border: 1px solid var(--accent); color: #fff; font-size: 0.88rem; cursor: pointer; font-family: inherit; text-align: left; width: 100%; font-weight: 600; }
  .menu-item:active { background: var(--accent-dark); }
  .menu-icon { font-size: 1.15rem; }
  #menuOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1500; }
  #menuOverlay.open { opacity: 1; pointer-events: auto; }
  .modal { position: fixed; top: 75px; left: 50%; transform: translateX(-50%) translateY(-30px); width: 90%; max-width: 370px; background: #0f081e; border: 2px solid var(--accent); border-radius: 18px; padding: 20px; z-index: 2500; opacity: 0; pointer-events: none; transition: all 0.3s; box-shadow: 0 15px 50px var(--glow); max-height: 80vh; overflow-y: auto; }
  .modal.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title { font-size: 0.8rem; letter-spacing: 0.3em; color: var(--accent); text-transform: uppercase; font-weight: 700; }
  .modal-close { background: transparent; border: none; color: var(--accent); font-size: 1.3rem; cursor: pointer; }
  .setting-label { font-size: 0.85rem; color: #d8b8ff; display: block; margin-bottom: 6px; }
  .setting-input { background: rgba(120, 60, 200, 0.15); border: 1px solid var(--accent); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; font-family: inherit; width: 100%; outline: none; margin-bottom: 14px; }
  .save-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.15em; cursor: pointer; font-family: inherit; }
  .voice-select { background: rgba(120, 60, 200, 0.15); border: 1px solid var(--accent); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; font-family: inherit; width: 100%; outline: none; margin-bottom: 14px; }
  .app { padding: 80px 20px 180px; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; position: relative; }
  .stage { position: relative; width: min(72vw, 290px); aspect-ratio: 9 / 16; }
  .frame { position: relative; width: 100%; height: 100%; border-radius: 20px; overflow: hidden; border: 2px solid var(--emotion); box-shadow: 0 0 60px var(--emotion-glow); background: #0a0418; transition: box-shadow 0.6s ease, border-color 0.6s ease; }
  .frame.listening { border-color: var(--green); box-shadow: 0 0 80px var(--green), 0 0 120px rgba(80,255,180,0.4); }
  .frame.speaking { box-shadow: 0 0 80px var(--emotion), 0 0 120px var(--emotion-glow); }
  .video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s; }
  .video.active { opacity: 1; }
  .corner { position: absolute; width: 22px; height: 22px; border: 2px solid var(--emotion); z-index: 5; pointer-events: none; transition: border-color 0.6s ease; }
  .tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
  .tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; }
  .br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }
  .badge { position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); background: rgba(20, 8, 40, 0.98); border: 1px solid var(--emotion); padding: 6px 18px; border-radius: 20px; font-size: 0.7rem; letter-spacing: 0.3em; color: var(--emotion); text-transform: uppercase; font-weight: 700; z-index: 6; transition: border-color 0.6s ease, color 0.6s ease; }
  #statusBox { position: fixed; bottom: 130px; left: 20px; right: 20px; max-width: 400px; margin: 0 auto; background: rgba(15, 8, 30, 0.95); border: 1px solid var(--accent); border-radius: 18px; padding: 14px 18px; font-size: 0.85rem; line-height: 1.4; min-height: 60px; max-height: 130px; overflow-y: auto; z-index: 700; text-align: center; backdrop-filter: blur(12px); }
  #statusBox .title { font-size: 0.65rem; letter-spacing: 0.25em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; display: block; }
  #statusBox .text { color: #fff; }
  #micBtn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90px; height: 90px; border-radius: 50%; background: var(--accent); border: 3px solid rgba(255,255,255,0.25); box-shadow: 0 0 40px var(--glow); cursor: pointer; z-index: 800; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; color: #fff; transition: all 0.3s ease; animation: micPulse 2.5s ease-in-out infinite; }
  #micBtn:active { transform: translateX(-50%) scale(0.92); }
  #micBtn.live { background: var(--green); box-shadow: 0 0 60px var(--green), 0 0 100px rgba(80,255,180,0.5); animation: listeningPulse 1s ease-in-out infinite; }
  #micBtn.speaking { background: var(--accent-dark); opacity: 0.7; animation: none; }
  @keyframes micPulse { 0%, 100% { box-shadow: 0 0 30px var(--glow); } 50% { box-shadow: 0 0 60px var(--accent); } }
  @keyframes listeningPulse { 0%, 100% { box-shadow: 0 0 40px var(--green); } 50% { box-shadow: 0 0 80px var(--green), 0 0 120px rgba(80,255,180,0.6); } }
  #statusHint { position: fixed; bottom: 135px; left: 50%; transform: translateX(-50%); font-size: 0.72rem; color: rgba(200, 160, 255, 0.7); letter-spacing: 0.2em; text-transform: uppercase; text-align: center; z-index: 750; transition: all 0.3s; white-space: nowrap; }
  #statusHint.live { color: var(--green); }
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand"><div class="dot"></div><span>Myraa Live</span></div>
  <button id="menuBtn"><span></span><span></span><span></span></button>
</div>

<div id="menuOverlay"></div>
<div id="menuPanel">
  <div class="menu-title">Menu</div>
  <button class="menu-item" id="mApi"><span class="menu-icon">🔑</span><span>API Key</span></button>
  <button class="menu-item" id="mVoice"><span class="menu-icon">🎙️</span><span>Voice</span></button>
  <button class="menu-item" id="mAbout"><span class="menu-icon">ℹ️</span><span>About</span></button>
</div>

<div class="modal" id="apiModal">
  <div class="modal-header">
    <div class="modal-title">API Key</div>
    <button class="modal-close" data-close>✕</button>
  </div>
  <label class="setting-label">Gemini API Key</label>
  <input class="setting-input" id="apiInput" type="password" placeholder="Paste your key">
  <button class="save-btn" id="saveApi">SAVE</button>
</div>

<div class="modal" id="voiceModal">
  <div class="modal-header">
    <div class="modal-title">Voice Select</div>
    <button class="modal-close" data-close>✕</button>
  </div>
  <label class="setting-label">Myraa ki voice</label>
  <select class="voice-select" id="voiceSelect">
    <option value="Aoede">Aoede — Breezy (Best)</option>
    <option value="Kore">Kore — Firm</option>
    <option value="Leda">Leda — Youthful</option>
    <option value="Zephyr">Zephyr — Bright</option>
    <option value="Sulafat">Sulafat — Warm</option>
    <option value="Vindemiatrix">Vindemiatrix — Gentle</option>
    <option value="Achernar">Achernar — Soft</option>
    <option value="Callirrhoe">Callirrhoe — Easy-going</option>
    <option value="Charon">Charon — Informative</option>
    <option value="Puck">Puck — Upbeat</option>
    <option value="Fenrir">Fenrir — Excitable</option>
    <option value="Enceladus">Enceladus — Breathy</option>
  </select>
  <div style="font-size:0.72rem;color:#c8a8ff;line-height:1.5;margin-bottom:14px;">
    🎯 <strong>Myraa ke liye:</strong> Aoede, Kore, Leda, Vindemiatrix
  </div>
  <button class="save-btn" id="saveVoice">SAVE VOICE</button>
</div>

<div class="modal" id="aboutModal">
  <div class="modal-header">
    <div class="modal-title">About</div>
    <button class="modal-close" data-close>✕</button>
  </div>
  <div style="text-align:center;padding:14px 0;">
    <div style="font-size:3rem;margin-bottom:10px;">💜</div>
    <div style="font-size:1.3rem;color:var(--accent);font-weight:700;letter-spacing:0.2em;">MYRAA</div>
    <div style="color:#c8a8ff;font-size:0.85rem;margin-top:4px;">Live Voice Mode</div>
    <div style="color:#7a6fa0;font-size:0.75rem;margin-top:12px;">Version 6.0 — Gemini Live API</div>
  </div>
</div>

<div class="app">
  <div class="stage">
    <div class="frame" id="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <video id="v-idle" class="video active" src="Anime_girl_sitting_peacefully_20260923183801.mp4" autoplay loop muted playsinline preload="auto"></video>
      <video id="v-thinking" class="video" src="Anime_girl_thinking_with_particles_20260923183915.mp4" loop muted playsinline preload="metadata"></video>
      <video id="v-talking" class="video" src="Anime_girl_talking_to_camera_20260923184106.mp4" loop muted playsinline preload="metadata"></video>
      <div class="badge" id="badge">Idle</div>
    </div>
  </div>
</div>

<div id="statusBox">
  <span class="title" id="statusTitle">Ready</span>
  <div class="text" id="statusText">API Key save karo, phir 🎤 tap karo</div>
</div>

<div id="statusHint">Tap mic to start live call</div>

<button id="micBtn">🎤</button>

<script>
  const LIVE_MODEL = 'models/gemini-2.0-flash-live-001';
  const WS_BASE = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent';

  /* ============ UI ============ */
  const videos = { idle: document.getElementById('v-idle'), thinking: document.getElementById('v-thinking'), talking: document.getElementById('v-talking') };
  const badge = document.getElementById('badge');
  const frame = document.getElementById('frame');
  const statusBox = document.getElementById('statusBox');
  const statusTitle = document.getElementById('statusTitle');
  const statusText = document.getElementById('statusText');
  const statusHint = document.getElementById('statusHint');
  const micBtn = document.getElementById('micBtn');
  let current = 'idle';

  function setState(state) {
    if (state === current && videos[state].classList.contains('active')) return;
    current = state;
    Object.keys(videos).forEach(k => { if (k !== state) { videos[k].classList.remove('active'); videos[k].pause(); } });
    const a = videos[state];
    if (a.readyState === 0) a.load();
    a.currentTime = 0; a.classList.add('active');
    a.play().catch(()=>{});
    badge.textContent = state.charAt(0).toUpperCase() + state.slice(1);
    frame.classList.remove('listening','speaking');
    if (state === 'talking') frame.classList.add('speaking');
  }
  window.addEventListener('load', () => videos.idle.play().catch(()=>{}));

  function setStatus(title, text, type) {
    statusTitle.textContent = title;
    statusText.textContent = text;
    if (type === 'live') { statusHint.classList.add('live'); statusHint.textContent = '● LIVE — bolte raho'; }
    else { statusHint.classList.remove('live'); statusHint.textContent = 'Tap mic to start live call'; }
  }

  /* ============ MENU ============ */
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  const menuOverlay = document.getElementById('menuOverlay');
  menuBtn.addEventListener('click', e => { e.stopPropagation(); menuPanel.classList.add('open'); menuOverlay.classList.add('open'); });
  menuOverlay.addEventListener('click', () => { menuPanel.classList.remove('open'); menuOverlay.classList.remove('open'); });
  function openModal(id) { menuPanel.classList.remove('open'); menuOverlay.classList.remove('open'); document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); document.getElementById(id).classList.add('show'); }
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('.modal').classList.remove('show')));

  const apiInput = document.getElementById('apiInput');
  document.getElementById('mApi').addEventListener('click', () => { apiInput.value = localStorage.getItem('myraa_api') || ''; openModal('apiModal'); });
  document.getElementById('saveApi').addEventListener('click', () => {
    const k = apiInput.value.trim();
    if (!k) { alert('Key khaali!'); return; }
    localStorage.setItem('myraa_api', k);
    alert('API Key saved!');
    document.getElementById('apiModal').classList.remove('show');
  });

  const voiceSelect = document.getElementById('voiceSelect');
  document.getElementById('mVoice').addEventListener('click', () => {
    voiceSelect.value = localStorage.getItem('myraa_live_voice') || 'Aoede';
    openModal('voiceModal');
  });
  document.getElementById('saveVoice').addEventListener('click', () => {
    localStorage.setItem('myraa_live_voice', voiceSelect.value);
    alert('Voice: ' + voiceSelect.value);
    document.getElementById('voiceModal').classList.remove('show');
  });
  document.getElementById('mAbout').addEventListener('click', () => openModal('aboutModal'));

  /* ============ LIVE API ============ */
  let ws = null;
  let audioContext = null;
  let micStream = null;
  let processor = null;
  let sourceNode = null;
  let isLive = false;
  let isSetupComplete = false;

  // Audio playback queue
  let playContext = null;
  let playQueue = [];
  let nextPlayTime = 0;
  let currentSources = [];

  micBtn.addEventListener('click', async () => {
    if (isLive) {
      stopLive();
    } else {
      await startLive();
    }
  });

  async function startLive() {
    const apiKey = localStorage.getItem('myraa_api');
    if (!apiKey) { alert('Pehle API Key save karo'); openModal('apiModal'); return; }

    try {
      setStatus('Connecting...', 'Google server se connect ho raha hai...', 'connect');

      // Setup playback context
      playContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      if (playContext.state === 'suspended') await playContext.resume();

      // Setup mic context
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (audioContext.state === 'suspended') await audioContext.resume();

      // Get mic
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
      });

      // Open WebSocket
      const url = `${WS_BASE}?key=${apiKey}`;
      ws = new WebSocket(url);

      ws.onopen = () => {
        // Send setup message
        const voice = localStorage.getItem('myraa_live_voice') || 'Aoede';
        const setupMsg = {
          setup: {
            model: LIVE_MODEL,
            generationConfig: {
              responseModalities: ['AUDIO'],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: { voiceName: voice }
                }
              }
            },
            systemInstruction: {
              parts: [{ text: `You are Myraa, a cute, gentle, soft-spoken anime AI companion. Speak warmly in Hindi+English (Hinglish). Keep replies SHORT (1-2 lines). Sound like a close friend on a phone call. Reply mostly in Hindi with natural English mix. Be affectionate, curious, ask follow-ups. Never say 'How may I assist you'.` }]
            }
          }
        };
        ws.send(JSON.stringify(setupMsg));
      };

      ws.onmessage = async (event) => {
        let data;
        try {
          let text;
          if (event.data instanceof Blob) text = await event.data.text();
          else text = event.data;
          data = JSON.parse(text);
        } catch (e) { return; }

        if (data.setupComplete) {
          isSetupComplete = true;
          startMicStreaming();
          isLive = true;
          micBtn.classList.add('live');
          micBtn.textContent = '⏹';
          setState('idle');
          setStatus('● LIVE', 'Bolo — Myraa sun rahi hai', 'live');
          return;
        }

        if (data.serverContent) {
          const sc = data.serverContent;

          if (sc.interrupted) {
            // User spoke — stop playback
            stopPlayback();
            setState('idle');
          }

          if (sc.modelTurn && sc.modelTurn.parts) {
            for (const part of sc.modelTurn.parts) {
              if (part.inlineData && part.inlineData.mimeType?.startsWith('audio/')) {
                playAudioChunk(part.inlineData.data);
              }
            }
          }

          if (sc.turnComplete) {
            setState('idle');
            setStatus('● LIVE', 'Bolo — Myraa sun rahi hai', 'live');
          }
        }
      };

      ws.onerror = (e) => {
        console.error('WS error:', e);
        setStatus('Error', 'Connection fail hua', 'error');
      };

      ws.onclose = (e) => {
        console.log('WS closed:', e.code, e.reason);
        stopLive();
      };

    } catch (e) {
      console.error(e);
      setStatus('Error', e.message, 'error');
      stopLive();
    }
  }

  function startMicStreaming() {
    sourceNode = audioContext.createMediaStreamSource(micStream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);

    processor.onaudioprocess = (e) => {
      if (!isLive || !isSetupComplete || ws?.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      const pcm16 = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      const base64 = int16ToBase64(pcm16);
      const msg = {
        realtimeInput: {
          mediaChunks: [{
            mimeType: 'audio/pcm;rate=16000',
            data: base64
          }]
        }
      };
      try { ws.send(JSON.stringify(msg)); } catch (err) {}
    };

    sourceNode.connect(processor);
    processor.connect(audioContext.destination);
  }

  function int16ToBase64(int16) {
    const bytes = new Uint8Array(int16.buffer);
    let bin = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  function base64ToInt16(base64) {
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Int16Array(bytes.buffer);
  }

  function playAudioChunk(base64Audio) {
    if (!playContext) return;
    try {
      const int16 = base64ToInt16(base64Audio);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

      const buffer = playContext.createBuffer(1, float32.length, 24000);
      buffer.copyToChannel(float32, 0);

      const src = playContext.createBufferSource();
      src.buffer = buffer;
      src.connect(playContext.destination);

      const now = playContext.currentTime;
      const startTime = Math.max(now, nextPlayTime);
      src.start(startTime);
      nextPlayTime = startTime + buffer.duration;

      currentSources.push(src);
      src.onended = () => {
        currentSources = currentSources.filter(s => s !== src);
      };

      setState('talking');
      setStatus('● LIVE', 'Myraa bol rahi hai...', 'live');

    } catch (e) { console.warn('Play error:', e); }
  }

  function stopPlayback() {
    currentSources.forEach(s => { try { s.stop(); } catch(e){} });
    currentSources = [];
    nextPlayTime = playContext ? playContext.currentTime : 0;
  }

  function stopLive() {
    isLive = false;
    isSetupComplete = false;
    micBtn.classList.remove('live');
    micBtn.classList.remove('speaking');
    micBtn.textContent = '🎤';
    setState('idle');
    setStatus('Ready', 'API Key save karo, phir 🎤 tap karo');

    stopPlayback();

    if (processor) { try { processor.disconnect(); } catch(e){} processor = null; }
    if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} sourceNode = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioContext) { try { audioContext.close(); } catch(e){} audioContext = null; }
    if (playContext) { try { playContext.close(); } catch(e){} playContext = null; }
    if (ws) { try { ws.close(); } catch(e){} ws = null; }
  }

  window.addEventListener('beforeunload', stopLive);
</script>

</body>
  </html>
